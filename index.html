<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sân Thượng Xanh</title>
<meta name="theme-color" content="#262c40">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sân Thượng">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <div id="frame">
    <div id="game"></div>
    <div id="boot" data-t="booting">Đang dọn sân thượng…</div>

    <div class="hud">
      <div class="pill" id="clockPill" aria-live="polite">
        <svg id="periodIcon" viewBox="0 0 32 32" aria-hidden="true"></svg>
        <span><span id="clock">--:--</span> <span class="sub" id="period"></span></span>
      </div>
      <button class="tag" id="infoBtn" type="button" aria-haspopup="dialog" data-t-label="info_button_label"></button>
      <div class="pill" data-t-label="coinsLabel">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="#f2b544" stroke="#3b2f2a" stroke-width="2.5"/><circle cx="16" cy="16" r="7" fill="none" stroke="#c98a1c" stroke-width="2"/></svg>
        <span id="coins">–</span>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <nav class="toolbar" data-t-label="toolsLabel">
      <button class="tool" type="button" id="toolBag" aria-haspopup="dialog">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 15h20l-2 18H12z" fill="#d9a46b" stroke="#3b2f2a" stroke-width="2.5" stroke-linejoin="round"/><path d="M15 15c0-4 2-7 5-7s5 3 5 7" fill="none" stroke="#3b2f2a" stroke-width="2.5" stroke-linecap="round"/><path d="M16 22h8" stroke="#3b2f2a" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span data-t="tool_bag"></span>
      </button>
      <button class="tool" type="button" id="toolWater">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 17h17v14a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3z" fill="#7fb6d9" stroke="#3b2f2a" stroke-width="2.5" stroke-linejoin="round"/><path d="M26 21l8-6" stroke="#3b2f2a" stroke-width="2.5" stroke-linecap="round"/><path d="M12 17c0-4 2.5-6 5.5-6s5.5 2 5.5 6" fill="none" stroke="#3b2f2a" stroke-width="2.5"/><circle cx="35" cy="20" r="1.4" fill="#7fb6d9"/><circle cx="33" cy="24" r="1.4" fill="#7fb6d9"/></svg>
        <span data-t="tool_water"></span>
      </button>
      <button class="tool" type="button" data-soon="soon_shop">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 17h24v16H8z" fill="#fff8ec" stroke="#3b2f2a" stroke-width="2.5" stroke-linejoin="round"/><path d="M6 10h28l-2 7H8z" fill="#e57d5a" stroke="#3b2f2a" stroke-width="2.5" stroke-linejoin="round"/><path d="M17 33v-8h6v8" fill="#d9a46b" stroke="#3b2f2a" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <span data-t="tool_shop"></span>
      </button>
      <button class="tool" type="button" data-soon="soon_settings">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="9" fill="#c9d3b8" stroke="#3b2f2a" stroke-width="2.5"/><circle cx="20" cy="20" r="3.5" fill="#fff8ec" stroke="#3b2f2a" stroke-width="2.5"/><path d="M20 6v5M20 29v5M6 20h5M29 20h5M10 10l3.5 3.5M26.5 26.5L30 30M30 10l-3.5 3.5M13.5 26.5L10 30" stroke="#3b2f2a" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span data-t="tool_settings"></span>
      </button>
    </nav>

    <div id="sheetWrap" hidden>
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <h2 id="sheetTitle" data-t="info_title"></h2>

        <div class="label" data-t="info_section_data"></div>
        <dl>
          <dt data-t="info_storage"></dt><dd id="iStorage">–</dd>
          <dt data-t="info_saved_at"></dt><dd id="iSavedAt">–</dd>
          <dt data-t="info_coins"></dt><dd id="iCoins">–</dd>
          <dt data-t="info_started"></dt><dd id="iStarted">–</dd>
          <dt data-t="info_game_time"></dt><dd id="iGameTime">–</dd>
          <dt data-t="info_away"></dt><dd id="iAway">–</dd>
          <dt data-t="info_rewound"></dt><dd id="iRewound">–</dd>
          <dt data-t="info_device_time"></dt><dd id="iTime">–</dd>
        </dl>
        <div class="actions">
          <button class="btn" type="button" id="addCoins" data-t="info_add_coins"></button>
          <button class="btn danger" type="button" id="resetData" data-t="info_reset"></button>
        </div>

        <div class="label" data-t="info_section_test"></div>
        <div class="actions three">
          <button class="btn" type="button" id="skip10m" data-t="info_skip_10m"></button>
          <button class="btn" type="button" id="skip1h" data-t="info_skip_1h"></button>
          <button class="btn" type="button" id="addSeeds" data-t="info_add_seeds"></button>
        </div>
        <p class="note" data-t="info_test_note"></p>

        <div class="label" data-t="info_section_device"></div>
        <dl>
          <dt data-t="info_version"></dt><dd id="iVer">–</dd>
          <dt data-t="info_mode"></dt><dd id="iMode">–</dd>
          <dt data-t="info_offline"></dt><dd id="iOffline">–</dd>
          <dt data-t="info_net"></dt><dd id="iNet">–</dd>
          <dt data-t="info_frame"></dt><dd id="iSize">–</dd>
          <dt data-t="info_screen"></dt><dd id="iScreen">–</dd>
          <dt data-t="info_dpr"></dt><dd id="iDpr">–</dd>
          <dt data-t="info_orient"></dt><dd id="iOrient">–</dd>
        </dl>

        <div class="label" data-t="info_section_period"></div>
        <div class="chips" id="periodChips">
          <button class="chip" type="button" data-p="auto" aria-pressed="true" data-t="period_auto"></button>
          <button class="chip" type="button" data-p="morning" aria-pressed="false" data-t="period_morning"></button>
          <button class="chip" type="button" data-p="afternoon" aria-pressed="false" data-t="period_afternoon"></button>
          <button class="chip" type="button" data-p="evening" aria-pressed="false" data-t="period_evening"></button>
          <button class="chip" type="button" data-p="night" aria-pressed="false" data-t="period_night"></button>
        </div>
        <p class="note" data-t="info_note"></p>
        <button class="close" type="button" id="sheetClose" data-t="close"></button>
      </div>
    </div>

    <!-- F01: chọn hạt để gieo -->
    <div id="seedWrap" class="wrap" hidden>
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="seedTitle">
        <h2 id="seedTitle" data-t="seed_title"></h2>
        <p class="note" data-t="seed_hint"></p>
        <ul class="seed-list" id="seedList"></ul>
        <button class="close" type="button" data-close data-t="close"></button>
      </div>
    </div>

    <!-- F10: túi đồ -->
    <div id="bagWrap" class="wrap" hidden>
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bagTitle">
        <div class="sheet-head">
          <h2 id="bagTitle" data-t="bag_title"></h2>
          <span class="slots" id="bagSlots"></span>
        </div>
        <div class="chips" id="bagTabs">
          <button class="chip" type="button" data-kind="all" aria-pressed="true" data-t="bag_tab_all"></button>
          <button class="chip" type="button" data-kind="seed" aria-pressed="false" data-t="bag_tab_seed"></button>
          <button class="chip" type="button" data-kind="produce" aria-pressed="false" data-t="bag_tab_produce"></button>
        </div>
        <div class="bag-grid" id="bagGrid"></div>
        <p class="note" data-t="bag_upgrade_note"></p>
        <button class="close" type="button" data-close data-t="close"></button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/phaser-3.80.1.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
